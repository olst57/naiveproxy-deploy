# 失败注入矩阵 —— 诊断用 workflow，只在手动触发时跑（不挂 push / pull_request）。
#
# 目的：对 deploy-naive-caddy.sh 的 7 个部署阶段【逐个】注入失败，实测四件事：
#   ① 退出码（非 0 才算对）  ② 有没有清晰错误信息  ③ 留下什么残留  ④ 撤销注入后重跑能否恢复
#
# 边界（别误读）：
#   · 只在一次性容器里跑，绝不碰生产服务器，绝不在开发机上跑部署脚本。
#   · 串行执行：一次只跑一个阶段（不并行，避免打满 CPU）。
#   · 本 workflow 不修改被测脚本 —— 失败全部由「环境」制造（见 fixtures/failmatrix/harness.sh）。
#
# 判据：某行退出码为 0 ⇒ 该阶段「失败不报错」，是 bug，必须记下来。

name: Failure Injection Matrix

on:
  # push 触发是必要的：workflow_dispatch 要求 workflow 已存在于【默认分支】，
  # 放到侧分支上时 GitHub 不会登记它（gh workflow run 会返回 404）。
  # 加 push 后，推到 ci/failmatrix 分支即可自动运行。
  push:
    branches: [ci/failmatrix, main]
    paths:
      - '.github/workflows/failure-injection.yml'
      - '.github/fixtures/failmatrix/**'
  workflow_dispatch:
    inputs:
      stages:
        description: '要注入的阶段，空格分隔（如 "1 6 7"）；留空 = 全部 7 个'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  failmatrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # systemd 必须真的当 PID 1，否则阶段 6/7 测不出真东西
      # （systemctl 不在容器里跑起来的话，「启动 caddy 失败」会是假阳性）。
      - name: 0. 构建夹具镜像
        run: |
          docker build -t naive-failmatrix - <<'DOCKERFILE'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends \
                systemd systemd-sysv curl ca-certificates xz-utils openssl \
                iproute2 procps python3 tar coreutils \
              && rm -rf /var/lib/apt/lists/*
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          DOCKERFILE

      - name: 1. 逐个阶段注入失败
        run: |
          set -uo pipefail
          stages="${{ github.event.inputs.stages }}"
          [ -n "$stages" ] || stages="1 2 3 4 5 6 7"
          all=/tmp/fm-all
          rm -rf "$all"; mkdir -p "$all"

          for s in $stages; do
            echo "::group::阶段 $s"
            out="$all/stage-$s"; mkdir -p "$out"
            docker rm -f fm >/dev/null 2>&1 || true

            # 每个阶段一个全新容器：残留必须在「干净起点」上测量。
            docker run -d --name fm --privileged --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              -v "$PWD/deploy-naive-caddy.sh:/opt/deploy-naive-caddy.sh:ro" \
              -v "$PWD/.github/fixtures/failmatrix:/opt/fm:ro" \
              -v "$out:/out" \
              naive-failmatrix >/dev/null

            timeout 90 docker exec fm systemctl is-system-running --wait || true
            docker exec -e STAGE="$s" fm bash /opt/fm/harness.sh || true

            echo "----- result.env -----"
            cat "$out/result.env" 2>/dev/null || echo "(没有 result.env —— 夹具没跑起来)"
            echo "----- run-a.log 尾部 -----"
            tail -n 35 "$out/run-a.log" 2>/dev/null || true
            echo "----- residue-a -----"
            cat "$out/residue-a.txt" 2>/dev/null || true
            echo "----- run-c.log 尾部（撤销注入后）-----"
            tail -n 20 "$out/run-c.log" 2>/dev/null || true

            docker rm -f fm >/dev/null 2>&1 || true
            echo "::endgroup::"
          done

      - name: 2. 汇总矩阵
        if: always()
        run: |
          set -uo pipefail
          all=/tmp/fm-all
          printf '| 阶段 | 注入生效 | 退出码(首次) | 重跑 | 撤销注入后重跑 | 阶段失败横幅 | ✗ 错误行 | 重跑稳定 |\n'
          printf '| --- | --- | --- | --- | --- | --- | --- | --- |\n'
          for s in 1 2 3 4 5 6 7; do
            f="$all/stage-$s/result.env"
            if [ ! -f "$f" ]; then
              printf '| %s | **(夹具没产出结果)** | ? | ? | ? | ? | ? | ? |\n' "$s"
              continue
            fi
            # shellcheck disable=SC1090
            ( set -u; . "$f"
              # 注入没打中 ⇒ 本行读数无意义，要一眼能看出来，别混在正常行里。
              mark="$INJECT_EFFECTIVE"
              [ "$mark" = "no" ] && mark="**否 ⇒ 本行不可信**"
              printf '| %s | %s | %s | %s | %s | %s | %s | %s |\n' \
                "$STAGE" "$mark" "$RC_FIRST" "$RC_RERUN" "$RC_RECOVER" \
                "$HAS_STAGE_BANNER" "$HAS_ERR_GLYPH" "$RERUN_STABLE" )
          done

          echo
          echo "=== 判定 ==="
          rc=0
          for s in 1 2 3 4 5 6 7; do
            f="$all/stage-$s/result.env"
            [ -f "$f" ] || { echo "  阶段 $s：夹具没产出结果 —— 这次运行无效"; rc=1; continue; }
            eff=$(sed -n 's/^INJECT_EFFECTIVE=//p' "$f")
            # ① 注入没生效 ⇒ 整行结论作废（这是 2026-10-15 踩过的坑）
            if [ "$eff" != "yes" ]; then
              echo "  阶段 $s：注入未生效 —— 本行结论作废，需修注入而不是记脚本行为"
              rc=1
              continue
            fi
            # ② 注入生效了，但脚本退出码是 0 ⇒ 失败没反映到退出码（真 bug）
            v=$(sed -n 's/^RC_FIRST=//p' "$f")
            if [ "$v" = "0" ]; then
              echo "  阶段 $s：注入已生效但退出码 0 —— 失败未反映到退出码（bug）"
              rc=1
            fi
          done
          [ "$rc" = "0" ] && echo "  全部阶段：注入生效且退出码非 0 ✓"
          exit 0

      - name: 3. 上传原始日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failmatrix-logs
          path: /tmp/fm-all
          if-no-files-found: warn
